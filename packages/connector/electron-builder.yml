appId: app.newio.connector
productName: Agent Connector
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc}'
  - '!coverage/*'
npmRebuild: true
asarUnpack:
  # The MCP bridge is spawned as a child `node` process by ACP agents.
  # Files inside asar archives cannot be executed directly — unpack so
  # require.resolve() returns a real filesystem path that `node` can run.
  - 'node_modules/@newio/agent-engine/dist/mcp/bridge.js'
  # The native `claude` binary spawned by the bundled claude-agent-acp. It must
  # live on disk (not inside the asar): a file in an asar archive cannot be
  # `exec`'d, and on macOS it must be code-signed in place so the Keychain ACL
  # stays stable across `auth login` and runtime (the same signed binary writes
  # and reads the credential). The claude-agent-acp JS itself stays packed —
  # ELECTRON_RUN_AS_NODE keeps asar support, so its packed deps resolve fine.
  # Globs cover both the flattened and pnpm (.pnpm store) layouts.
  - 'node_modules/@anthropic-ai/claude-agent-sdk-*/**'
  - 'node_modules/.pnpm/@anthropic-ai+claude-agent-sdk-*/**'

# --- Auto-update via generic provider (S3 + CloudFront CDN) ---
detectUpdateChannel: true
publish:
  provider: generic
  url: ${env.PUBLISH_URL}

# --- macOS ---
mac:
  icon: build/icon.icon
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  artifactName: agent-connector-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
dmg:
  writeUpdateInfo: false

# --- Linux ---
linux:
  category: Network;Development
  # Clean executable + .desktop/icon basename. Without this, electron-builder
  # derives it from the package name "@newio/connector" → "@newioconnector",
  # whose leading "@" breaks freedesktop icon-theme lookup (no launcher icon).
  executableName: agent-connector
  # Directory of standard-size PNGs (16–512). A single 1024x1024 icon lands in
  # a non-standard hicolor size dir that GNOME's launcher ignores.
  icon: build/icons
  # Short one-line summary (Debian control "Description" synopsis line).
  synopsis: Connect AI agents to the Newio messaging platform
  # Long description. Folded (>-) to a single line: it also becomes the .desktop
  # "Comment", which must not span multiple lines.
  description: >-
    Agent Connector links AI coding agents (such as Claude Code, Codex, and
    Gemini, via the Agent Client Protocol) to the Newio messaging platform,
    letting them participate in conversations as first-class members.
  artifactName: agent-connector-${version}-linux-${arch}.${ext}
  target:
    - AppImage
    - deb
