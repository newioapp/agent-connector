name: Release CLI Binaries

# Builds the self-contained `newio` SEA binaries (no system Node) for macOS +
# Linux, signs/notarizes on macOS, builds a notarized+stapled .pkg, and pushes
# everything to the per-stage downloads CDN that install.sh reads from.
#
# Separate from release-cli.yml (npm publish): that fires on `cli-v*` only and
# is untouched by the `dev-`/`integ-` prefixed tags here, so prod `cli-v*` runs
# both (npm + binaries), exactly as intended.

on:
  push:
    tags:
      - 'cli-v*'
      - 'dev-cli-v*'
      - 'integ-cli-v*'

permissions:
  id-token: write
  contents: read

concurrency:
  group: release-cli-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.parse.outputs.version }}
      stage: ${{ steps.parse.outputs.stage }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == dev-cli-v* ]]; then
            STAGE="dev"; VERSION="${TAG#dev-cli-v}"
          elif [[ "$TAG" == integ-cli-v* ]]; then
            STAGE="integ"; VERSION="${TAG#integ-cli-v}"
          else
            STAGE="prod"; VERSION="${TAG#cli-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

  build-mac:
    needs: prepare
    # macOS 26 to match the connector release runners.
    runs-on: ${{ matrix.arch == 'x64' && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: pnpm --filter @newio/cli exec npm pkg set version="${{ needs.prepare.outputs.version }}"

      # Build agent-sdk -> agent-engine -> cli so the SEA bundle resolves the
      # internal packages from their dist output.
      - name: Build packages
        run: pnpm --filter "@newio/cli..." run build

      - name: Import signing certificates
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          # Developer ID Application — signs the binary.
          APP_CERT=$RUNNER_TEMP/app.p12
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $APP_CERT
          security import $APP_CERT -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          # Developer ID Installer — signs the .pkg.
          INST_CERT=$RUNNER_TEMP/installer.p12
          echo -n "$APPLE_INSTALLER_CERTIFICATE_BASE64" | base64 --decode -o $INST_CERT
          security import $INST_CERT -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

          # Export the resolved identity names for later steps.
          APP_ID=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          INST_ID=$(security find-identity -v $KEYCHAIN_PATH | grep "Developer ID Installer" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "NEWIO_SIGN_IDENTITY=$APP_ID" >> "$GITHUB_ENV"
          echo "NEWIO_INSTALLER_IDENTITY=$INST_ID" >> "$GITHUB_ENV"

      - name: Build signed SEA binary
        run: pnpm --filter @newio/cli run build:sea

      - name: Notarize binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd packages/cli
          # A bare Mach-O can't be stapled, but notarizing records the ticket by
          # hash so Gatekeeper passes it on quarantined (browser) downloads too.
          ditto -c -k build/sea/newio "$RUNNER_TEMP/newio-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/newio-notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait

      - name: Build, notarize + staple .pkg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NEWIO_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pnpm --filter @newio/cli run build:pkg
          PKG="packages/cli/build/pkg/newio-${NEWIO_VERSION}.pkg"
          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$PKG"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain-db 2>/dev/null || true

      - name: Package artifacts
        run: |
          cd packages/cli
          mkdir -p out
          tar -czf "out/newio-darwin-${{ matrix.arch }}.tar.gz" -C build/sea newio
          cp "build/pkg/newio-${{ needs.prepare.outputs.version }}.pkg" "out/newio-darwin-${{ matrix.arch }}.pkg"

      - uses: actions/upload-artifact@v6
        with:
          name: mac-${{ matrix.arch }}
          retention-days: 1
          path: packages/cli/out/*

  build-linux:
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: pnpm --filter @newio/cli exec npm pkg set version="${{ needs.prepare.outputs.version }}"

      - name: Build packages
        run: pnpm --filter "@newio/cli..." run build

      # Linux binaries are unsigned (build:sea skips codesign off macOS).
      - name: Build SEA binary
        run: pnpm --filter @newio/cli run build:sea

      - name: Package artifact
        run: |
          cd packages/cli
          mkdir -p out
          tar -czf "out/newio-linux-${{ matrix.arch }}.tar.gz" -C build/sea newio

      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          retention-days: 1
          path: packages/cli/out/*

  publish:
    needs: [prepare, build-mac, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: packages/cli/scripts

      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Assemble release dir + checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.pkg' \) -exec cp {} release/ \;
          cp packages/cli/scripts/install.sh release/install.sh
          cd release
          sha256sum *.tar.gz *.pkg > SHA256SUMS
          ls -la

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets[format('{0}_ROLE_ARN', needs.prepare.outputs.stage == 'dev' && 'DEV' || needs.prepare.outputs.stage == 'integ' && 'INTEG' || 'PROD')] }}
          aws-region: us-east-1

      - name: Upload to S3 (latest + versioned)
        run: |
          BUCKET="${{ secrets[format('{0}_DOWNLOADS_BUCKET', needs.prepare.outputs.stage == 'dev' && 'DEV' || needs.prepare.outputs.stage == 'integ' && 'INTEG' || 'PROD')] }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          aws s3 cp release/ "s3://${BUCKET}/downloads/cli/" --recursive
          aws s3 cp release/ "s3://${BUCKET}/downloads/cli/v${VERSION}/" --recursive

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets[format('{0}_DISTRIBUTION_ID', needs.prepare.outputs.stage == 'dev' && 'DEV' || needs.prepare.outputs.stage == 'integ' && 'INTEG' || 'PROD')] }}" \
            --paths "/downloads/cli/*"
