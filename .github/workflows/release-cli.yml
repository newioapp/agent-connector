name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write
  id-token: write

jobs:
  # Gate the release on the live platform e2e suite (human ↔ backend ↔ connector
  # ↔ puppet agent), exercising the real daemon/CLI/RPC stack against the shared
  # dev backend before anything is published. The agent is a deterministic
  # @newio/acp-puppet (no LLM), so the only external inputs are the dev backend
  # URLs below — set them as repo secrets (named for their purpose so they can't
  # collide with any other use of a NEWIO_API_URL; the suite still reads the
  # canonical NEWIO_API_URL/NEWIO_WS_URL env vars, mapped from the secrets below):
  #   NEWIO_E2E_API_URL  e.g. https://api.<dev-host>.newio.app
  #   NEWIO_E2E_WS_URL   e.g. wss://ws.<dev-host>.newio.app
  # Auth is the dev backend's open /auth/test-login, so no token/LLM/AWS secret
  # is needed here (AWS creds are only for the binary-upload workflow).
  e2e:
    name: E2E (live dev backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `test:e2e` builds @newio/e2e and its workspace deps (agent-sdk →
      # agent-engine → cli → puppet) first, then runs the *.e2e.test.ts specs
      # serially (each spawns the real `newio` daemon against the dev backend).
      - name: Run platform e2e
        run: pnpm --filter @newio/e2e run test:e2e
        env:
          NEWIO_API_URL: ${{ secrets.NEWIO_E2E_API_URL }}
          NEWIO_WS_URL: ${{ secrets.NEWIO_E2E_WS_URL }}

  release:
    name: Build, Test, Publish
    needs: e2e
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          pnpm --filter @newio/cli exec npm pkg set version="$VERSION"

      # Build the CLI and its workspace dependencies (agent-sdk -> agent-engine
      # -> cli, in order). The internal packages resolve from their dist/ output,
      # so they must be built before tsup bundles them into the binary.
      - run: pnpm --filter "@newio/cli..." run build
      - run: pnpm --filter @newio/cli run test

      - name: Publish to npm
        run: pnpm --filter @newio/cli publish --no-git-checks --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
