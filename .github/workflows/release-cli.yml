name: Release CLI

on:
  # npm publishing for @newio/cli is not yet set up, so the automatic `cli-v*`
  # tag trigger is disabled to stop prod releases failing on the publish step.
  # Distribution is handled by release-cli-binaries.yml (SEA binaries -> CDN).
  # Re-add the `push: tags: ['cli-v*']` trigger once the npm token/org is
  # configured; until then this can be run manually via the Actions UI.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # Gate the release on the shared platform e2e suite (real daemon/CLI ↔ backend
  # ↔ deterministic puppet agent) before publishing. Reusable workflow so the
  # binaries release uses the exact same gate; `secrets: inherit` passes the
  # DEV_*/INTEG_* backend secrets through. Prod releases (cli-v*) gate on integ;
  # manual dispatches stay on dev. See .github/workflows/e2e.yml.
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      backend: ${{ startsWith(github.ref_name, 'cli-v') && 'integ' || 'dev' }}
    secrets: inherit

  release:
    name: Build, Test, Publish
    needs: e2e
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          pnpm --filter @newio/cli exec npm pkg set version="$VERSION"

      # Build the CLI and its workspace dependencies (agent-sdk -> agent-engine
      # -> cli, in order). The internal packages resolve from their dist/ output,
      # so they must be built before tsup bundles them into the binary.
      - run: pnpm --filter "@newio/cli..." run build
      - run: pnpm --filter @newio/cli run test

      - name: Publish to npm
        run: pnpm --filter @newio/cli publish --no-git-checks --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
